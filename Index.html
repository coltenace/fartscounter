<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FARTSCOUNT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen">

        <div class="login-box">

            <div class="logo">FC</div>

            <h1>FARTSCOUNT</h1>

            <p>Anonymous posting board</p>

            <input
                id="codeInput"
                type="password"
                maxlength="10"
                placeholder="Enter access code"
            >

            <button onclick="login()">Enter</button>

            <p id="errorMessage" class="error"></p>

        </div>

    </div>


    <!-- WEBSITE -->
    <div id="website" class="hidden">

        <header>

            <div>
                <h2>FARTSCOUNT</h2>
                <span>Anonymous Board</span>
            </div>

            <button class="logout" onclick="logout()">Lock</button>

        </header>


        <main>

            <!-- CREATE POST -->
            <section class="composer">

                <textarea
                    id="postInput"
                    maxlength="1000"
                    placeholder="What's on your mind?"
                ></textarea>

                <div class="composer-bottom">

                    <span id="characterCount">
                        0 / 1000
                    </span>

                    <button onclick="createPost()">
                        Post Anonymously
                    </button>

                </div>

            </section>


            <!-- POSTS -->
            <section id="posts"></section>

        </main>

    </div>


    <script src="app.js"></script>

</body>
</html>
